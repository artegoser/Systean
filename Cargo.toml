[workspace]
members = [
    "crates/systean-core",
    "crates/systean-cli",
    "crates/systean-wasm",
]
default-members = [
    "crates/systean-core",
    "crates/systean-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Artemy Egorov <artegoser@gmail.com>"]

[workspace.dependencies]
chumsky = { version = "=0.13.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.9"
wasm-bindgen = "=0.2.126"
