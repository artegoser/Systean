[meta]
description = "Human-facing definitions and Phase 19 learning metadata for canonical Systean roots. Semantic identity and signatures are owned by typed/lexicon.semsys."
version = "19.2"

[sol]
definition = """The primary star of a planetary system: the self-luminous stellar body around which that system's planets orbit."""

[ref]
definition = "Universal typed shorthand reference resolved only by deterministic discourse compatibility."

[mi]
definition = "The current discourse speaker supplied by the explicit runtime context."

[tu]
definition = "The current discourse addressee supplied by the explicit runtime context."

[na]
definition = "Marks the following canonical Systean name payload as one proper-name-denoting entity; no source-language pronunciation is inferred."

[ke]
definition = "Marks an utterance as a truth question about its propositional content."

[ne]
definition = "Logical negation of a proposition."

[va]
definition = "Logical conjunction: all joined propositions hold."

[zo]
definition = "Logical disjunction: at least one joined proposition holds."

[ra]
definition = "Universal quantification over every entity satisfying the stated restriction."

[mu]
definition = "Existential quantification: at least one entity satisfies the stated restriction and body."

[da]
definition = "Marks propositional content as a command speech act."

[me]
definition = "Marks propositional content as a request speech act."

[per]
definition = "A human person; as a class predicate, the value is human."

[anim]
definition = "An animal; as a class predicate, the value is an animal."

[lok]
definition = "A spatial location; as a class predicate, the value functions as a location."

[obj]
definition = "A physical object; as a class predicate, the value is materially instantiated."

[vid]
definition = "Visual perception in which an observer visually perceives one observed entity."

[aud]
definition = "Auditory perception in which an observer hears one entity or sound-source entity."

[mov]
definition = "Physical movement of one entity, without encoding a destination."

[ven]
definition = "Arrival of a moving entity at an explicitly stated target."

[vad]
definition = "Directed movement of an entity toward an explicitly stated destination."

[don]
definition = "Intentional transfer of one item from an explicit giver to an explicit recipient."

[ten]
definition = "Physical holding relation between a holder and the held entity."

[hab]
definition = "Possession relation between an explicit possessor and possessed entity."

[fak]
definition = "Intentional creation in which an explicit creator brings an explicit product into existence."

[viv]
definition = "The explicit entity is alive."

[mor]
definition = "The explicit entity dies; this root states the death relation without inferring time or aspect."

[nov]
definition = "The explicit value is new relative to an explicitly supplied comparison standard."

[vet]
definition = "The explicit value is old relative to an explicitly supplied comparison standard."

[bon]
definition = "Positive evaluation of a value by an explicitly supplied criterion."

[mal]
definition = "Negative evaluation of a value by an explicitly supplied criterion."

[ver]
definition = "Explicitly presents propositional content as true without adding world-state inference to parsing."

[fal]
definition = "Explicitly presents propositional content as false; it is a distinct lexical identity from logical negation."

[sim]
definition = "Similarity between two explicit values along one explicitly supplied comparison dimension."

[dif]
definition = "Difference between two explicit values along one explicitly supplied comparison dimension."

[par]
definition = "Equality between two explicit values along one explicitly supplied comparison dimension."

[mag]
definition = "The left value is greater than the right value along one explicitly supplied comparison dimension."

[min]
definition = "The left value is less than the right value along one explicitly supplied comparison dimension."

[in]
definition = "Spatial relation in which one value is inside an explicit container."

[sur]
definition = "Spatial relation in which one value is above an explicit reference entity."

[sub]
definition = "Spatial relation in which one value is below an explicit reference entity."

[prok]
definition = "Spatial nearness relative to both an explicit reference entity and an explicit distance standard."

[dist]
definition = "Spatial farness relative to both an explicit reference entity and an explicit distance standard."

[zna]
definition = "Knowledge relation between an explicit knower and explicit propositional content."

[bel]
definition = "Belief relation between an explicit believer and explicit propositional content."

[mem]
definition = "Remembering relation between an explicit rememberer and explicit propositional content."

[dum]
definition = "Thinking or considering relation between an explicit thinker and explicit propositional content."

[nom]
definition = "A textual value functioning as a name; this lexical concept is distinct from the proper-name marker `na`."

[tekst]
definition = "A textual value."

[ling]
definition = "A language as an explicit entity."

[gov]
definition = "Speech or utterance by an explicit speaker of explicit textual content."

[skrib]
definition = "Writing or symbolic encoding by an explicit writer of explicit textual content."

[nau]
definition = "The current instant supplied by the explicit runtime context; no clock value is guessed from text."

[ante]
definition = "Temporal relation stating that the left temporal value is before the right temporal value."

[aft]
definition = "Temporal relation stating that the left temporal value is after the right temporal value."

[pot]
definition = "Temporal relation stating that an explicit temporal value occurs during an explicit interval."

[temp]
definition = "An explicit temporal value: an instant, interval, calendar date, or time of day."

[sta]
definition = "Starts one explicit occurrence target; the parser does not infer whether that target exists or actually begins."

[stop]
definition = "Ceases one explicit occurrence or activity target without implying that it can never recur."

[dur]
definition = "Continues one explicit occurrence or activity target."

[fin]
definition = "Finishes one explicit occurrence target; completion is distinct from generic cessation."

[rup]
definition = "Interrupts one explicit occurrence target without asserting completion."

[reg]
definition = "Constructs a habitual or recurrent activity from one explicit occurrence target."

[rep]
definition = "Constructs an explicitly counted repeated activity from one explicit occurrence target."

[unk]
definition = "A typed value explicitly unknown to the following stated or context-bound knower."

[vak]
definition = "A typed value deliberately left unspecified by the utterance."

[hid]
definition = "A typed value intentionally withheld rather than merely unknown or unspecified."

[rov]
definition = "Exactly the stated number of members of the explicit class satisfy the quantified body."

[mini]
definition = "At least the stated number of members of the explicit class satisfy the quantified body."

[maks]
definition = "At most the stated number of members of the explicit class satisfy the quantified body."

[set]
definition = "An unordered collection identity constructed from two explicit entity members; larger sets are nested compositionally."

[list]
definition = "An ordered collection identity constructed from two explicit entity members; larger lists are nested compositionally."

[grup]
definition = "A collective group entity constructed from two explicit entity members."

[kol]
definition = "Marks propositional content for collective interpretation without changing its semantic roles."

[dis]
definition = "Marks propositional content for distributive interpretation without changing its semantic roles."

[aso]
definition = "States an explicitly underspecified association between two entities without guessing a more specific relation."

[imp]
definition = "Material/logical implication between explicit propositional condition and consequence."

[hip]
definition = "Counterfactual causal relation between an explicit antecedent and consequence; distinct from material implication."

[tip]
definition = "Typical or normal-case claim for an explicit domain, explicit measure, and explicit numeric standard."

[stat]
definition = "Statistical claim for an explicit domain and measure with an explicit numeric proportion/value."

[prob]
definition = "Explicit probability assigned to an explicit proposition."

[frek]
definition = "Explicit frequency claim about an activity under an explicit measure and numeric value."


[emo]
definition = "Explicitly expresses one declared subjective state; it never infers affect from prosody or changes the state's literal content."

[fok]
definition = "Marks an explicit semantic value already present in propositional content as focus without reordering or changing its semantic role."

[top]
definition = "Marks an explicit semantic value already present in propositional content as topic without changing semantic roles or quantifier scope."

[ret]
definition = "Explicitly retracts the uniquely identified prior discourse commitment numbered by its repair target."

[kor]
definition = "Explicitly corrects the uniquely identified prior discourse commitment by replacing it with new propositional content."

[klar]
definition = "Explicitly clarifies the uniquely identified prior discourse entry with additional propositional content."

[felis]
definition = "Joy; a general positive affective state; represented as an experienced affective state with explicit experiencer and intensity."

[satis]
definition = "Satisfaction; positive response to an achieved or sufficient state; represented as an experienced affective state with explicit experiencer and intensity. Its target is explicit propositional content."

[seren]
definition = "Calm; low affective tension; represented as an experienced affective state with explicit experiencer and intensity."

[amuz]
definition = "Amusement; pleasure from something perceived as funny or entertaining; represented as an experienced affective state with explicit experiencer and intensity. Its target is explicit propositional content."

[entuz]
definition = "Excitement/enthusiasm; high-activation positive affect; represented as an experienced affective state with explicit experiencer and intensity. Its target is explicit propositional content."

[inter]
definition = "Interest; sustained affective engagement with an object/topic; represented as an experienced affective state with explicit experiencer and intensity. Its target is an explicit entity."

[kuri]
definition = "Curiosity; motivation to obtain currently unknown information; represented as an experienced affective state with explicit experiencer and intensity. Its target is an explicit entity."

[esper]
