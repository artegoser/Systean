[meta]
description = "Defines normative Systean surface-syntax policies. Lexical roots and their surface realizations live only in dictionary.toml."
version = "1.4"

[order]
frame = "primary_predicate_rest"
free_order = false

[scope]
open = "ki"
close = "ku"
explicit = "when_ambiguous"
quantifier_order = "appearance"

[logic]
flatten_same_operator = true

[logic.precedence]
and = 20
or = 10
implies = 5
counterfactual = 5

[roles]
realization = "frame_order"

[arguments]
omission = "unique_reference_only"

[questions]
realization = "explicit_operator"

[commands]
realization = "explicit_operator"

[focus]
reorders = false

[grammar]
traditional_pos = false

[discourse]
alias = "ali"
definition = "def"
relative = "rel"
frame = "fra"

[quotation]
open = "sit"
close = "tis"
