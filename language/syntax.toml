[meta]
description = "Defines Phase 19 structural markers and the remaining engine-level surface policies. Lexical forms and discourse effects are owned by typed Systean declarations."
version = "1.9"

[order]
frame = "primary_predicate_rest"

[scope]
open = "ki"
close = "ku"

[arguments]
omission = "unique_reference_only"

[discourse]
alias = "ali"
definition = "def"
relative = "rel"
frame = "fra"

[quotation]
open = "sit"
close = "tis"

[text]
utterance_spoken = "du"
utterance_written = "."
readability_punctuation = [",", ":", ";", "?", "!"]
