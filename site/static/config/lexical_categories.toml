# Systean Lexical Categories (TOML Specification)

# Types

# Noun (N)
# RelativePronoun (RPron)
# Verb (V)
# Imperative Verb (IV)
# Auxiliary Verb (AV)
# Adjective (Adj)
# Adverb (Adv)
# Preposition (P)
# Determiner (Det)

# QuestionParticle (QPart)
# ImperativeParticle (IPart)

# Conjunction (Conj) 
# SubordinatingConjunction (SubConj)

# NestUp
# NestDown
# NestHighest

# \+: many or zero
# \*: many (at least one)
# \?: optional
# |: or

# # Sentence
# S → SentP
# | QuestionParticle SentP
# | ImperativeParticle IVP NP SubClause?

# SubClause → SubConj SentP

# Nest -> NestUp | NestDown | NestHighest

# SentP -> SubClause? NP VP P? NP (Nest? Conj? SentP)+
# NP → Det? AdjP+ N (Nest? PP)+ (Nest? RelP)+

# VP → AV? AdjP+ V
# IVP → AdjP+ IV

# AdjP → Adv? Adj
# PP → P NP
# RelP → RPron VP

[N]
name = 'Noun'
description = """
Nouns represent entities, objects, or concepts, 
functioning as the core of a noun phrase (NP). They 
can be subjects, objects, or complements in a sentence.

Includes personal pronouns that replace specific nouns, referring 
to persons or things. They indicate person, number, 
and sometimes gender, serving as subjects or objects.
"""

[RPron]
name = 'Relative Pronoun'
description = """
Relative pronouns introduce relative clauses, linking 
them to a noun or pronoun in the main clause. They 
provide additional information about the referent.
"""

[V]
name = "Verb"
description = """
Verbs express actions, states, or occurrences. They 
form the core of the verb phrase (VP) and agree with 
the subject in person and number.
"""

[IV]
name = "Imperative Verb"
description = """
Imperative verbs express commands, requests, or 
instructions. They typically lack an explicit 
subject and are used in imperative verb phrases (IVP).
"""

[AV]
name = "Auxilary Verb"
description = """
Auxiliary verbs support the main verb in a verb 
phrase, indicating tense, mood, or aspect. They 
precede the main verb and are optional in VP.
"""

[Adj]
name = "Adjective"
description = """
Adjectives modify nouns, describing their quality, 
quantity, or extent. They appear in adjective 
phrases (AdjP) and can be stacked in NP.
"""

[Adv]
name = "Adverb"
description = """
Adverbs modify verbs, adjectives, or other adverbs, 
indicating manner, time, place, or degree. They are 
optional in adjective phrases (AdjP).
"""

[P]
name = "Preposition"
description = """
Prepositions introduce prepositional phrases (PP), 
indicating relationships like location, time, or 
direction between a noun phrase and other elements.
"""

[Det]
name = "Determiners"
description = """
Determiners introduce noun phrases, specifying 
definiteness, quantity, or possession. They are 
optional and precede adjectives in NP.
"""

[QPart]
name = "Question Particle"
description = """
Question particles mark a sentence as 
interrogative, typically appearing at the start 
of a sentence to indicate a question.
"""

[IPart]
name = "Imperative Particle"
description = """
Imperative particles introduce imperative 
sentences, signaling a command or request, 
often paired with an imperative verb phrase (IVP).
"""

[Conj]
name = "Conjuction"
description = """
Conjunctions connect clauses or phrases, 
coordinating elements of equal syntactic 
status within a sentence.
"""

[SubConj]
name = "Subordinating Conjunction"
description = """
Subordinating conjunctions introduce 
subordinate clauses, establishing a 
dependency relationship with the main clause.
"""

[NestUp]
name = "Nest Up"
description = """
NestUp indicates an upward shift in the 
syntactic nesting level, used to structure 
complex sentences or phrases hierarchically.
"""

[NestDown]
name = "Nest Down"
description = """
NestDown indicates a downward shift in 
the syntactic nesting level, used to close 
or reduce the hierarchical structure.
"""

[NestHighest]
name = "Nest Highest"
description = """
NestHighest marks the highest level of 
syntactic nesting, used to denote the 
topmost structural layer in a sentence or phrase.
"""
