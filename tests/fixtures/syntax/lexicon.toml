syntax = { kind = "class", role = "entity" }

[kan]
definition = "Fixture class of dogs."
semantic = { kind = "operator", name = "dog" }
syntax = { kind = "class", role = "entity" }

[vi]
definition = "Fixture relation of seeing."
semantic = { kind = "operator", name = "see" }
syntax = { kind = "predicate", primary_role = "observer", rest_roles = ["observed"] }

[si]
definition = "Fixture relation of sleeping."
semantic = { kind = "operator", name = "sleep" }
syntax = { kind = "predicate", primary_role = "sleeper", rest_roles = [] }
